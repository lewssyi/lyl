{
  "schema_version": "xai_feedback_experiments_v1",
  "default_enabled": false,
  "canonical_baseline": "E0",
  "teacher_target_default": "pc_seqlime_without_stage_prior",
  "teacher_target_split": "train",
  "teacher_mode_default": "self_distillation_in_sample",
  "label_conditioned_targets_allowed": false,
  "head_output_shape": [null, 75, 30, 3],
  "losses": [
    "normalized_mse",
    "kl_divergence",
    "js_divergence",
    "rank_correlation_surrogate",
    "top_k_bce"
  ],
  "schedule": {
    "warmup_epochs": 3,
    "linear_ramp_epochs": 5,
    "early_stop_on_validation_faithfulness": true
  },
  "lambda_sweep": [0.0, 0.0001, 0.0005, 0.001],
  "gradient_scopes": ["head_only", "fusion_and_head", "full_backbone"],
  "reliability_gate": {
    "validation_weighted_r2_min": 0.70,
    "mask_seed_stability_spearman_min": 0.50,
    "original_mask_error_max": 0.00001,
    "physiological_deletion_advantage_vs_random_min": 0.0,
    "physiological_insertion_advantage_vs_random_min": 0.0,
    "prediction_correctness_used_by_gate": false,
    "teacher_confidence_used_by_gate": false
  },
  "acceptance_thresholds": {
    "classification_macro_f1_drop_max": 0.005,
    "classification_accuracy_drop_max": 0.005,
    "explanation_deletion_auc_improvement_min": 0.0,
    "explanation_insertion_auc_improvement_min": 0.0,
    "explanation_stability_spearman_improvement_min": 0.0,
    "surrogate_validation_weighted_r2_median_min": 0.80,
    "surrogate_validation_weighted_r2_p10_min": 0.60
  },
  "experiments": {
    "E0": {"description": "Frozen A1-zero baseline", "head_enabled": false, "xai_loss_weight": 0.0},
    "E1": {"description": "Explanation head parameter control", "head_enabled": true, "xai_loss_weight": 0.0},
    "E2": {"description": "Random-target negative control", "target": "random_target_control"},
    "E3": {"description": "Shuffled-target negative control", "target": "shuffled_target_control"},
    "E4": {"description": "Classic Sequence-LIME target", "target": "classic_sequence_lime"},
    "E5": {"description": "Physiological single-feature target", "target": "physiological_single_feature"},
    "E6": {"description": "LIME-physiology consensus target", "target": "lime_physiology_consensus"},
    "E7": {"description": "Predicted-stage-prior circularity control only", "target": "pc_seqlime_with_predicted_stage_prior_ablation", "requires_explicit_stage_prior_ablation_flag": true}
  },
  "claim_boundary": "E1-E7 are optional experiments. Nothing changes the A1-zero default unless LFTS_XAI_FEEDBACK_ENABLED=1 is explicitly set."
}
